services:
  agentvisor:
    build: .
    ports:
      - "127.0.0.1:${AGENTVISOR_PORT:-8420}:8420"
    environment:
      AGENTVISOR_DATA: /data
      AGENTVISOR_MODEL_RUNTIME: lmstudio
      AGENTVISOR_MODEL_URL: http://host.docker.internal:1234
      AGENTVISOR_MODEL_TOKEN: ${AGENTVISOR_MODEL_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agentvisor-data:/data
      - ${AGENTVISOR_WORKSPACE:-./workspace}:/workspaces/project
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
volumes:
  agentvisor-data:
